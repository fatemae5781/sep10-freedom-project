<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Left lens -->
      <a-box position="-0.3 1.5 -2" depth="0.05" height="0.4" width="0.3" color="#555"></a-box>

      <!-- Right lens -->
      <a-box position="0.3 1.5 -2" depth="0.05" height="0.4" width="0.3" color="#555"></a-box>

      <!-- Bridge between lenses -->
      <a-box position="0 1.5 -2" depth="0.05" height="0.4" width="0.6" color="#555"></a-box>

      <!-- Headband -->
      <a-box position="0 2 -2" rotation="90 0 0" width="0.8" height="0.05" depth="0.2" color="#222"></a-box>

      <!-- Headband extension -->
      <a-box position="0 1.8 -2" rotation="90 0 0" width="0.8" height="0.05" depth="0.2" color="#222"></a-box>

      <!-- Camera for view -->
      <a-camera position="0 1.6 0"></a-camera>

    </a-scene>
  </body>
</html>
