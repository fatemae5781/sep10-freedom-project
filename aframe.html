<!DOCTYPE html>
<html>
  <head>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>


<a-scene background="color: transparent" shadow="enabled: false">
      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>


      <a-entity position="0 1.2 -3">

        <a-box width="2" height="0.5" depth="0.7" color="#1a1a1a"></a-box>


        <a-box
          position="1.2 0 0"
          width="0.9"
          height="0.4"
          depth="0.6"
          color="#cccccc"
        ></a-box>



        <a-box
          position="-0.6 0.15 0.36"
          width="0.08"
          height="0.08"
          depth="0.08"
          color="#00ffcc"
          material="emissive:#00ffcc; emissiveIntensity:0.8"
        ></a-box>
      </a-entity>

      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
