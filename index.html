<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medical Autopsy</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&family=Pacifico&display=swap" rel="stylesheet" />
<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding-top: 80px;
  background: linear-gradient(135deg, #74c7f9, #2980b9);
  color: #fff;
}

.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  background-color: #006699;
  display: flex;
  justify-content: center;
  padding: 10px 0;
  box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  z-index: 999;
}
.navbar a {
  color: #fff;
  margin: 0 15px;
  text-decoration: none;
  font-family: 'Pacifico', cursive;
  font-size: 1.2rem;
  cursor: pointer;
}
.navbar a:hover {
  color: #ffd700;
  text-decoration: underline;
}
h1 {
  font-family: 'Pacifico', cursive;
  font-size: 3rem;
  text-align: center;
  margin: 20px 0;
}
h2 {
  font-family: 'Pacifico', cursive;
  font-size: 2rem;
  margin-top: 50px;
  margin-bottom: 20px;
  text-align: center;
}
section {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}
#aframe {
  width: 100%;
  height: 250px;
  margin: auto;
}
img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: auto;
}
.content-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
}

.content-row:nth-child(even) {
  flex-direction: row-reverse;
}

.content-text {
  flex: 1 1 300px;
  padding: 10px;
}
.content-image {
  flex: 1 1 300px;
  padding: 10px;
}

.future-section {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  margin-bottom: 50px;
}
.future-side {
  flex: 1 1 200px;
  max-width: 200px;
  padding: 10px;
}
.future-center {
  flex: 1 1 200px;
  min-width: 200px;
  text-align: center;
}
@media(max-width: 768px) {
  .content-row {
    flex-direction: column;
  }
  .future-section {
    flex-direction: column;
  }
}
</style>
</head>
<body>


<nav class="navbar">
  <a href="#welcome">Home</a>
  <a href="#intro">Introduction</a>
  <a href="#existing">Part A: Tech</a>
  <a href="#future">Part B: Future</a>
</nav>


<section id="welcome">
<h1>Welcome to Medical Autopsy</h1>
<div id="aframe">
  <iframe src="Aframe.html" class="aframe" style="width:100%; height:250px; border:none;"></iframe>
</div>
</section>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
