<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stick Man</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
<a-scene>


  <a-camera position="0 1.6 3" look-controls></a-camera>

  <a-entity position="0 0 0">

    <a-sphere position="0 1.8 0" radius="0.2" color="#000"></a-sphere>

    <a-cylinder position="0 1 0" height="0.8" radius="0.1" color="#000"></a-cylinder>

    <a-cylinder position="0.2 0.4 0" height="0.5" radius="0.05" color="#000"></a-cylinder>
    <a-cylinder position="-0.2 0.4 0" height="0.5" radius="0.05" color="#000"></a-cylinder>

    <a-cylinder
      position="-0.4 1.2 0"
      height="0.4"
      radius="0.05"
      color="#000"
      animation="property: rotation; to: 0 0 45; dur: 1000; easing: easeInOutSine; loop: true; dir: alternate">
    </a-cylinder>

    <a-cylinder position="0.4 1.2 0" height="0.4" radius="0.05" color="#000"></a-cylinder>

  </a-entity>

</a-scene>
</body>
</html>
